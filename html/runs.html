
<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Runs — Jash</title>
  <link rel="stylesheet" href="../css/styles.css" />
</head>

<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand" aria-label="Jash home">
        <span class="brand-mark">◈</span> Jash
      </div>

      <nav class="nav-links" aria-label="Main navigation">
        <button type="button" data-page="index.html">
          ⌂&nbsp; Home
        </button>
        <button type="button" data-page="runs.html" aria-current="page">
          ◌&nbsp; Runs
        </button>
        <button type="button" data-page="community.html">
          ♧&nbsp; Community
        </button>
      </nav>

      <button
        class="theme-toggle"
        id="theme-toggle"
        type="button"
        aria-label="Enable dark mode"
        aria-pressed="false"
      >☾</button>

      <div class="account-actions" id="account-actions">
        <button class="sign-in" id="user-settings" type="button">
          User Settings
        </button>
        <button class="sign-in" id="sign-out" type="button">
          Sign Out
        </button>
        <button class="sign-in" id="sign-in-nav" type="button" hidden>
          Sign In
        </button>
      </div>
    </header>

    <main class="runs-main">
      <div class="page-heading">
        <h1>Your Runs</h1>
        <p id="runs-description">
          Previous conversations saved to your account.
        </p>
      </div>

      <p
        id="runs-status"
        class="runs-status"
        role="status"
        aria-live="polite"
      >Loading your runs…</p>

      <div class="runs-layout">

        <!-- Previous chats -->
        <section
          class="panel runs-list-panel"
          aria-labelledby="runs-list-title"
        >
          <h2 id="runs-list-title">Previous chats</h2>
          <div id="runs-list" class="runs-list"></div>
        </section>

        <!-- Selected conversation -->
        <section
          class="panel run-detail-panel"
          aria-labelledby="run-detail-title"
        >
          <h2 id="run-detail-title">Select a chat</h2>

          <!-- Centered empty state -->
          <div
            id="run-detail-empty"
            class="run-detail-empty"
          >
            <div class="run-empty-content">

              <div class="run-empty-icon" aria-hidden="true">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="28"
                  height="28"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.7"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
                </svg>
              </div>

              <h3 id="run-detail-empty-title">
                No conversation selected
              </h3>

              <p id="run-detail-empty-description">
                Choose a previous chat to view its messages.
              </p>

            </div>
          </div>

          <div id="run-messages" class="run-messages"></div>
        </section>

      </div>
    </main>
  </div>

  <script defer src="../javascript/theme.js"></script>
  <script type="module" src="../javascript/runs.js"></script>
</body>

</html>
