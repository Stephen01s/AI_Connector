<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — Jash</title>
  <link rel="stylesheet" href="../css/styles.css" />
</head>

<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand" aria-label="Jash home"><span class="brand-mark">◈</span> Jash</div>
      <nav class="nav-links" aria-label="Main navigation">
        <button type="button" data-page="index.html">⌂&nbsp; Home</button>
        <button type="button" data-page="runs.html">◌&nbsp; Runs</button>
        <button type="button" data-page="community.html">♧&nbsp; Community</button>
      </nav>
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Enable dark mode" aria-pressed="false">☾</button>
      <div class="account-actions" id="account-actions">
        <button class="sign-in" id="user-settings" type="button" hidden>User Settings</button>
        <button class="sign-in" id="sign-out" type="button" hidden>Sign Out</button>
        <button class="sign-in" id="sign-in-nav" type="button" hidden>Sign In</button>
      </div>
    </header>
    <main class="auth-main">
      <section class="auth-card" aria-labelledby="auth-title">
        <div class="auth-brand"><span class="brand-mark">◈</span> Jash</div>
        <p class="auth-eyebrow">YOUR WORKSPACE</p>
        <h1 id="auth-title">Welcome back</h1>
        <p class="auth-description">Sign in to continue to your collaborative runs.</p>
        <button class="primary auth-submit" id="google-sign-in" type="button">Continue with Google</button>
        <p class="auth-divider">or use email and password</p>
        <form id="email-form">
          <label for="auth-email">Email
            <input id="auth-email" name="email" type="email" autocomplete="email" required placeholder="you@example.com" />
          </label>
          <label for="auth-password">Password
            <input id="auth-password" name="password" type="password" autocomplete="current-password" minlength="6" required placeholder="At least 6 characters" />
          </label>
          <label id="new-username-label" for="new-username" hidden>Username for a new account
            <input id="new-username" name="username" autocomplete="username" maxlength="50" />
          </label>
          <button class="primary auth-submit" id="submit-email-auth" type="submit">Sign In</button>
        </form>
        <div class="auth-secondary-actions">
          <button type="button" id="toggle-auth-mode">Create an account</button>
          <button type="button" id="reset-password">Forgot password?</button>
        </div>
        <p id="sign-in-status" class="auth-status" role="status" aria-live="polite"></p>
        <p class="auth-footnote">For a legacy account, use the email address linked to your existing profile. New accounts must verify their email before accessing saved runs.</p>
      </section>
    </main>
  </div>
  <script defer src="../javascript/theme.js" ></script>
  <script type="module" src="../javascript/sign-in.js"></script>
  <script type="module" src="../javascript/account.js"></script>
</body>

</html>
